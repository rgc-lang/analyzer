name: Publish to VS Code Marketplace

# 使用 Microsoft Entra ID（工作负载身份联合）发布，不依赖 PAT。
# 参考: https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    defaults:
      run:
        working-directory: editors/code
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Azure login (OIDC managed identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      # 一次性：把输出中的 id（托管身份的 Azure DevOps profile ID）加入
      # https://marketplace.visualstudio.com/manage/publishers/rgc-dev 的成员（角色 Contributor）
      - name: Print managed identity resource ID (one-time setup)
        run: |
          echo "=== profiles/me ==="
          az rest -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me" --resource 499b84ac-1321-427f-aa17-267ca6975798 || true
          echo "=== connectionData ==="
          az rest -u "https://app.vssps.visualstudio.com/_apis/connectionData?api-version=7.1" --resource 499b84ac-1321-427f-aa17-267ca6975798

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath rgc-lang.vsix --azure-credential